<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค้นหาโลเคชั่น — คลังวัตถุดิบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== variables ===== */
:root{
  --bg:#0b1220; --panel:#111a2e; --line:#1e2a44; --text:#e5edf9; --muted:#8a9ab8;
  --amber:#f59e0b; --cyan:#22d3ee; --green:#4ade80; --red:#f87171; --white:#f8fafc;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* ===== base ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Sarabun',system-ui,sans-serif;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-attachment:fixed}
/* ===== layout ===== */
.wrap{max-width:820px;margin:0 auto;padding:16px}
header h1{margin:0;font-size:22px;color:var(--amber)}
header p{margin:2px 0 12px;color:var(--muted);font-size:14px}
/* ===== components ===== */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs button.on{background:var(--amber);color:#111;border-color:var(--amber)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
input[type=search],textarea{width:100%;background:#070c17;color:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px;font:18px/1.5 'Sarabun',sans-serif}
textarea{min-height:150px;resize:vertical;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase}
input[type=search]:focus,textarea:focus{outline:2px solid var(--cyan);border-color:transparent}
.row{display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap}
button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:#1a2540;color:var(--text);
  font:600 16px 'Sarabun',sans-serif;cursor:pointer}
button:active{transform:scale(.97)}
.count{color:var(--muted);font-size:14px}
.hint{color:var(--muted);font-size:14px;margin:0 0 8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#0d1528}
.item-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.code{font:700 18px var(--mono);letter-spacing:1px;color:var(--cyan)}
.name{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:4px;font-size:15px}
.qty{font-family:var(--mono);color:var(--white)}
.note{color:var(--amber)}
.loc{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:#1e293b;border:1px solid #475569}
.also{font-size:13px;color:var(--muted)}
mark{background:#3b2a07;color:var(--amber);border-radius:3px;padding:0 2px}
/* กลุ่มโลเคชั่นในรายการจ่าย */
.group{border:2px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;background:#0d1528}
.group-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#16213a;flex-wrap:wrap}
.group-no{min-width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--mono);background:var(--amber);color:#111}
.group-name{font-size:18px;font-weight:700}
.group.done{opacity:.55}
.pick{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.pick input{width:24px;height:24px;margin-top:3px;flex:none;accent-color:var(--green)}
.pick.ticked .name,.pick.ticked .code{text-decoration:line-through;color:var(--muted)}
.err{border:1px dashed var(--red);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:15px}
.err .code{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:16px 0}
#tests{font:13px/1.5 var(--mono)} #tests .ok{color:var(--green)} #tests .bad{color:var(--red)}
.hidden{display:none}
/* ===== @media ===== */
@media (max-width:480px){ header h1{font-size:20px} .code{font-size:16px} }
</style>
</head>

    <div id="searchOut"></div>

        <button id="btnClear">ล้าง</button>
        <span class="count" id="pickCount"></span>
      </div>
    </div>
    <div id="pickOut"></div>
  </section>

  <section id="tests" class="panel hidden"></section>
</div>

// ===== 2. STATE =====
// ไม่เก็บอะไรลงเครื่อง (ไม่มี localStorage) — ติ๊กหยิบแล้วอยู่จนปิดหน้า
const state = { tab: 'search', q: '', codesText: '', ticked: new Set() };

// ===== 3. DATA LAYER =====
// แปลง array ดิบ → object ใช้ง่าย
const stockRows = STOCK.map((r, i) => ({
  i, code: String(r[0]).trim(), name: r[1] === 'ไม่พบรหัส' ? '' : String(r[1] || ''),
  qty: r[2], unit: String(r[3] || ''), loc: String(r[4] || '').trim(), note: String(r[5] || '').trim(),
}));
const productMap = new Map(PRODUCTS.map(p => [normCode(p[0]), { code: String(p[0]), name: String(p[1] || ''), unit: String(p[2] || '') }]));

// ===== 4. BUSINESS LOGIC (pure — ห้ามแตะ DOM) =====
function normCode(s) { return String(s == null ? '' : s).trim().toUpperCase(); }
function normText(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }

// ค้นหา: ทุกคำที่พิมพ์ (คั่นด้วยเว้นวรรค) ต้องเจอใน รหัส/ชื่อ/โลเคชั่น/หมายเหตุ
function searchStock(rows, q) {
  const words = normText(q).split(' ').filter(Boolean);
  if (!words.length) return [];
  return rows.filter(r => {
    const hay = normText(r.code + ' ' + r.name + ' ' + r.loc + ' ' + r.note);
    return words.every(w => hay.includes(w));
  });
}
// ค้นในชีตสินค้า (ใช้เมื่อหาในใบจดสต๊อคไม่เจอ)
function searchProducts(map, q, limit) {
  const words = normText(q).split(' ').filter(Boolean);
  if (!words.length) return [];
  const out = [];
  for (const p of map.values()) {
    const hay = normText(p.code + ' ' + p.name);
    if (words.every(w => hay.includes(w))) { out.push(p); if (out.length >= limit) break; }
  }
  return out;
}

// แยกข้อความที่วางมาเป็นรายการรหัส (บรรทัด / เว้นวรรค / จุลภาค) ตัดซ้ำ คงลำดับเดิม
function parseCodes(text) {
  const seen = new Set(), codes = [];
  let dup = 0;
  for (const raw of String(text || '').split(/[\s,;]+/)) {
    const c = normCode(raw);
    if (!c) continue;
    if (seen.has(c)) { dup++; continue; }
    seen.add(c); codes.push(c);
  }
  return { codes, dup };
}

// ลำดับโลเคชั่น: ตาม LOC_ORDER ก่อน ที่เหลือเรียงตามชื่อ
function locRank(loc) { const i = LOC_ORDER.indexOf(loc); return i < 0 ? LOC_ORDER.length : i; }

// สร้างรายการจ่าย แยกกลุ่มตามโลเคชั่น
// คืน { groups:[{loc, items:[{code,name,unit,lines:[{qty,note}],otherLocs:[]}]}], notInStock:[{code,name,unit}], notFound:[code] }
function buildPickList(codes, rows, products) {
  const byCode = new Map();
  for (const r of rows) {
    const k = normCode(r.code);
    if (!byCode.has(k)) byCode.set(k, []);
    byCode.get(k).push(r);
  }
  const groupMap = new Map(), notInStock = [], notFound = [];
  for (const c of codes) {
    const hits = byCode.get(c);
    if (!hits) {
      const p = products.get(c);
      if (p) notInStock.push(p); else notFound.push(c);
      continue;
    }
    const locs = [...new Set(hits.map(h => h.loc || 'ไม่ระบุโลเคชั่น'))];
    for (const loc of locs) {
      const here = hits.filter(h => (h.loc || 'ไม่ระบุโลเคชั่น') === loc);
      const p = products.get(c);
      if (!groupMap.has(loc)) groupMap.set(loc, []);
      groupMap.get(loc).push({
        code: here[0].code,
        name: here[0].name || (p ? p.name : ''),
        unit: here[0].unit || (p ? p.unit : ''),
        lines: here.map(h => ({ qty: h.qty, note: h.note })),
        otherLocs: locs.filter(l => l !== loc),
      });
    }
  }
  const groups = [...groupMap.entries()]
    .map(([loc, items]) => ({ loc, items }))
    .sort((a, b) => locRank(a.loc) - locRank(b.loc) || a.loc.localeCompare(b.loc, 'th'));
  return { groups, notInStock, notFound };
}

function fmtQty(n) {
  if (n === '' || n == null || isNaN(n)) return '-';
  return Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
}

// ===== 5. RENDER =====
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
// ไฮไลต์คำที่ค้น
function hl(text, q) {
  let out = esc(text);
  const words = normText(q).split(' ').filter(Boolean).sort((a, b) => b.length - a.length);
  for (const w of words) {
    const re = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  }
  return out;
}

function render() {
  document.getElementById('tabSearch').classList.toggle('on', state.tab === 'search');
  document.getElementById('tabPick').classList.toggle('on', state.tab === 'pick');
  document.getElementById('viewSearch').classList.toggle('hidden', state.tab !== 'search');
  document.getElementById('viewPick').classList.toggle('hidden', state.tab !== 'pick');
  if (state.tab === 'search') renderSearch(); else renderPick();
}

function renderSearch() {
  const out = document.getElementById('searchOut'), cnt = document.getElementById('searchCount');
  const q = state.q;
  if (!normText(q)) { cnt.textContent = 'ในใบจดสต๊อคมี ' + stockRows.length + ' แถว'; out.innerHTML = ''; return; }
  const hits = searchStock(stockRows, q).sort((a, b) => locRank(a.loc) - locRank(b.loc) || a.i - b.i);
  let html = hits.slice(0, SEARCH_LIMIT).map(r => `
    <div class="item">
      <div class="item-top"><span class="code">${hl(r.code, q)}</span><span class="name">${r.name ? hl(r.name, q) : '<span class="also">(ไม่มีชื่อในชีตสินค้า)</span>'}</span></div>
      <div class="meta">
        <span class="loc">📍 ${hl(r.loc || 'ไม่ระบุโลเคชั่น', q)}</span>
        <span class="qty">${fmtQty(r.qty)} ${esc(r.unit)}</span>
        ${r.note ? `<span class="note">${hl(r.note, q)}</span>` : ''}
      </div>
    </div>`).join('');
  cnt.textContent = hits.length ? `พบ ${hits.length} แถว` + (hits.length > SEARCH_LIMIT ? ` (แสดง ${SEARCH_LIMIT} แถวแรก พิมพ์เพิ่มเพื่อกรอง)` : '') : 'ไม่พบในใบจดสต๊อค';
  if (!hits.length) {
    const ps = searchProducts(productMap, q, 20);
    html = ps.length
      ? `<p class="hint">มีในชีตสินค้า แต่ไม่อยู่ในใบจดสต๊อค (ไม่มีโลเคชั่น):</p>` + ps.map(p => `
        <div class="item"><div class="item-top"><span class="code">${hl(p.code, q)}</span><span class="name">${hl(p.name, q)}</span></div>
        <div class="meta"><span class="also">หน่วย ${esc(p.unit)}</span></div></div>`).join('')
      : '<div class="empty">ไม่พบรายการ ลองพิมพ์ให้สั้นลง หรือพิมพ์คำอื่น</div>';
  }
  out.innerHTML = html;
}

function renderPick() {
  const out = document.getElementById('pickOut'), cnt = document.getElementById('pickCount');
  const { codes, dup } = parseCodes(state.codesText);
  if (!codes.length) { cnt.textContent = ''; out.innerHTML = '<div class="empty">ยังไม่มีรหัส</div>'; return; }
  const res = buildPickList(codes, stockRows, productMap);
  const found = codes.length - res.notInStock.length - res.notFound.length;
  cnt.textContent = `${codes.length} รหัส → ${res.groups.length} โลเคชั่น` +
    (res.notInStock.length + res.notFound.length ? ` · ไม่มีโลเคชั่น ${res.notInStock.length + res.notFound.length}` : '') +
    (dup ? ` · ตัดรหัสซ้ำ ${dup}` : '');
  let html = '';
  if (res.notFound.length || res.notInStock.length) {
    html += '<div class="panel"><h3 style="margin:0 0 8px;font-size:16px;color:var(--red)">ไม่มีโลเคชั่น</h3>' +
      res.notInStock.map(p => `<div class="err"><span class="code">${esc(p.code)}</span> ${esc(p.name)} — มีในชีตสินค้า แต่ไม่อยู่ในใบจดสต๊อค</div>`).join('') +
      res.notFound.map(c => `<div class="err"><span class="code">${esc(c)}</span> — ไม่พบรหัสนี้ทั้งในใบจดสต๊อคและชีตสินค้า</div>`).join('') +
      '</div>';
  }
  html += res.groups.map((g, gi) => {
    const keys = g.items.map(it => g.loc + '|' + it.code);
    const doneN = keys.filter(k => state.ticked.has(k)).length;
    return `
    <div class="group${doneN === keys.length ? ' done' : ''}">
      <div class="group-head"><span class="group-no">${gi + 1}</span><span class="group-name">📍 ${esc(g.loc)}</span>
        <span class="count">หยิบแล้ว ${doneN}/${keys.length}</span></div>
      ${g.items.map((it, ii) => {
        const k = keys[ii], on = state.ticked.has(k);
        return `<label class="pick${on ? ' ticked' : ''}">
          <input type="checkbox" data-key="${esc(k)}"${on ? ' checked' : ''}>
          <div>
            <div class="item-top"><span class="code">${esc(it.code)}</span><span class="name">${it.name ? esc(it.name) : '<span class="also">(ไม่มีชื่อในชีตสินค้า)</span>'}</span></div>
            <div class="meta">${it.lines.map(l => `<span class="qty">มี ${fmtQty(l.qty)} ${esc(it.unit)}${l.note ? ` <span class="note">${esc(l.note)}</span>` : ''}</span>`).join('')}</div>
            ${it.otherLocs.length ? `<div class="also">⚠ รหัสนี้มีอีกที่: ${it.otherLocs.map(esc).join(', ')}</div>` : ''}
          </div></label>`;
      }).join('')}
    </div>`;
  }).join('');
  out.innerHTML = html;
}

// ===== 6. EVENT HANDLERS =====
document.getElementById('tabSearch').addEventListener('click', () => { state.tab = 'search'; render(); document.getElementById('q').focus(); });
document.getElementById('tabPick').addEventListener('click', () => { state.tab = 'pick'; render(); document.getElementById('codes').focus(); });
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; renderSearch(); });
document.getElementById('codes').addEventListener('input', e => { state.codesText = e.target.value; renderPick(); });
document.getElementById('btnClear').addEventListener('click', () => {
  state.codesText = ''; state.ticked.clear();
  document.getElementById('codes').value = ''; renderPick(); document.getElementById('codes').focus();
});
document.getElementById('pickOut').addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.key;
  if (!k) return;
  if (e.target.checked) state.ticked.add(k); else state.ticked.delete(k);
  renderPick();
});

// ===== 7. INIT + TEST SUITE (?test=1) =====
document.getElementById('dataInfo').textContent =
  `ข้อมูลจากใบจดสต๊อค ${stockRows.length} แถว · ${new Set(stockRows.map(r => r.loc)).size} โลเคชั่น` + (DATA_DATE ? ` · อัปเดต ${DATA_DATE}` : '');
render();

const tests = [];
function test(name, fn) { tests.push({ name, fn }); }
function assertEq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(msg || `${JSON.stringify(a)} != ${JSON.stringify(b)}`); }
function runTests() {
  const R = [
    { i: 0, code: '4100005', name: 'กัวกัม ( GUAR GUM )', qty: 1125, unit: 'KG', loc: 'ห้องอุณหภูมิปกติ', note: 'SUP ทั่วไป' },
    { i: 1, code: '4100005', name: 'กัวกัม ( GUAR GUM )', qty: 1225, unit: 'KG', loc: 'ห้องอุณหภูมิปกติ', note: 'SUP เนสเล่ห์' },
    { i: 2, code: '4700055', name: 'PREMIX VPMP 2016', qty: 520, unit: 'KG', loc: 'พื้นที่ด้านนอก', note: '' },
    { i: 3, code: '4700055', name: 'PREMIX VPMP 2016', qty: 340, unit: 'KG', loc: 'ห้องควบคุมอุณหภูมิ', note: '' },
    { i: 4, code: 'GHDH09141', name: '', qty: 195, unit: 'KG', loc: 'หน้าห้อง GRAIN', note: '' },
    { i: 5, code: '4100013', name: 'XANTHAN  GUM', qty: 825, unit: 'KG', loc: 'ห้องอุณหภูมิปกติ', note: '' },
  ];
  const P = new Map([['9000001', { code: '9000001', name: 'ของไม่มีในสต๊อค', unit: 'EA' }]]);
  test('parseCodes: แยกบรรทัด/เว้นวรรค/จุลภาค + ตัดซ้ำ + ตัวพิมพ์เล็ก', () => {
    assertEq(parseCodes('4100005\n 4700055 ,ghdh09141\n4100005\n\n'), { codes: ['4100005', '4700055', 'GHDH09141'], dup: 1 });
  });
  test('parseCodes: ค่าว่าง/null', () => { assertEq(parseCodes(''), { codes: [], dup: 0 }); assertEq(parseCodes(null), { codes: [], dup: 0 }); });
  test('searchStock: หาด้วยรหัสบางส่วน', () => assertEq(searchStock(R, '41000').map(r => r.i), [0, 1, 5]));
  test('searchStock: หลายคำ ต้องเจอครบทุกคำ + ไม่สนตัวพิมพ์/เว้นวรรคซ้อน', () => assertEq(searchStock(R, 'xanthan   gum').map(r => r.i), [5]));
  test('searchStock: ค้นด้วยโลเคชั่น', () => assertEq(searchStock(R, 'grain').map(r => r.i), [4]));
  test('searchStock: คำว่าง = ไม่มีผล', () => assertEq(searchStock(R, '   ').length, 0));
  test('buildPickList: แยกกลุ่มตาม LOC_ORDER (ห้องควบคุม → อุณหภูมิปกติ → หน้าห้อง GRAIN → ด้านนอก)', () => {
    const r = buildPickList(['4700055', '4100005', 'GHDH09141'], R, P);
    assertEq(r.groups.map(g => g.loc), ['ห้องควบคุมอุณหภูมิ', 'ห้องอุณหภูมิปกติ', 'หน้าห้อง GRAIN', 'พื้นที่ด้านนอก']);
  });
  test('buildPickList: รหัสอยู่ 2 ที่ → ขึ้นทั้ง 2 กลุ่ม + บอกอีกที่', () => {
    const r = buildPickList(['4700055'], R, P);
    assertEq(r.groups.map(g => [g.loc, g.items[0].otherLocs]), [['ห้องควบคุมอุณหภูมิ', ['พื้นที่ด้านนอก']], ['พื้นที่ด้านนอก', ['ห้องควบคุมอุณหภูมิ']]]);
  });
  test('buildPickList: รหัสเดียวกัน ที่เดียวกัน หลายแถว → 1 รายการ หลายจำนวน', () => {
    const r = buildPickList(['4100005'], R, P);
    assertEq(r.groups.length, 1); assertEq(r.groups[0].items[0].lines.map(l => l.qty), [1125, 1225]);
  });
  test('buildPickList: ไม่อยู่ในใบจด แต่มีในชีตสินค้า / ไม่มีเลย', () => {
    const r = buildPickList(['9000001', 'XXX'], R, P);
    assertEq([r.groups.length, r.notInStock.map(p => p.code), r.notFound], [0, ['9000001'], ['XXX']]);
  });
  test('fmtQty: ทศนิยม/ค่าว่าง', () => { assertEq(fmtQty(657.72), '657.72'); assertEq(fmtQty(1125), '1,125'); assertEq(fmtQty(null), '-'); });
  test('ข้อมูลฝัง: มีข้อมูล + ทุกแถวมีรหัส', () => { if (!stockRows.length) throw new Error('STOCK ว่าง'); assertEq(stockRows.filter(r => !r.code).length, 0); });

  let ok = 0; const lines = [];
  for (const t of tests) {
    try { t.fn(); ok++; lines.push(`<div class="ok">✔ ${esc(t.name)}</div>`); }
    catch (e) { lines.push(`<div class="bad">✘ ${esc(t.name)} — ${esc(e.message)}</div>`); }
  }
  const el = document.getElementById('tests');
  el.innerHTML = `<b>TEST ${ok}/${tests.length} ผ่าน</b>` + lines.join('');
  el.classList.remove('hidden');
  console.log(`TEST ${ok}/${tests.length}`);
}
if (new URLSearchParams(location.search).get('test')) runTests();
